name: Build macOS installers

# Produces 4 .dmg files (2 brandings x 2 CPU architectures) from the exact
# same source this project builds on Windows — see CMakeLists.txt for the
# E_LAB_SCHOOL_BRANDING option and README.md > "Compiler pour macOS" for the
# full explanation.
#
# All 4 jobs run on Apple Silicon (macos-14) hardware. GitHub's hosted Intel
# (macos-13) runners were observed staying queued indefinitely on this
# account/repo (GitHub has been shrinking that pool now that Apple no longer
# ships Intel Macs), so the x86_64 builds are produced by CROSS-COMPILING
# from the arm64 runner instead of waiting for an Intel runner:
#   - a second, Intel-only Homebrew is installed under Rosetta 2 at
#     /usr/local (the classic Intel prefix; /opt/homebrew stays arm64-only)
#   - dylibbundler (and Qt's own non-Qt dependencies) are installed from
#     THAT Homebrew, so dylibbundler ends up x86_64 Mach-O — macOS runs it
#     transparently via Rosetta, no special invocation needed
#   - CMAKE_OSX_ARCHITECTURES=x86_64 tells the (arch-agnostic) Apple clang
#     to emit x86_64 object code regardless of the host being arm64
#
# Two more wrinkles, both discovered by actually testing a built .dmg on old
# hardware (a 2015 MacBook Pro, macOS 12.7.6) rather than trusting a green
# CI run:
#
# 1. Homebrew's own installer script now refuses to run on any non-Apple-
#    Silicon host (Homebrew 7.0, Sept 2026) — including under Rosetta, since
#    it checks `uname -m`. The x86_64 leg below no longer uses that script;
#    it bootstraps Homebrew manually (a plain tarball extract into the
#    classic Intel prefix), which still works.
# 2. Homebrew cannot build anything targeting an older macOS than the
#    machine doing the build — confirmed by Homebrew maintainers
#    (github.com/orgs/Homebrew/discussions/2340): its build wrapper
#    ("superenv") actively strips any CMAKE_OSX_DEPLOYMENT_TARGET /
#    MACOSX_DEPLOYMENT_TARGET override. Built on this macos-14 (Sonoma)
#    runner via `brew install qt`, the resulting QtWidgets.framework
#    referenced libc++ symbols (std::pmr) absent on macOS < 14 — the app
#    crashed on launch on anything older with "Symbol not found:
#    __ZNSt3__13pmr15memory_resourceD2Ev, Expected in:
#    /usr/lib/libc++.1.dylib" (confirmed on the same 2015 MacBook Pro).
#    Fixed by NOT installing Qt through Homebrew at all: the "Build Qt
#    (qtbase)" and "Build macdeployqt" steps below download Qt's own
#    upstream source and invoke cmake directly, so our own
#    -DCMAKE_OSX_DEPLOYMENT_TARGET (matching CMakeLists.txt) actually takes
#    effect. Homebrew is still used normally for qtbase's own non-Qt
#    dependency libraries and for dylibbundler — neither showed this
#    problem. This is also why the job timeout below is generous: building
#    Qt from source easily takes over an hour.
# 3. Homebrew's `opencv` formula builds every optional module (dnn, ml,
#    calib3d, stitching, gapi, FFmpeg + its whole codec chain, Tesseract
#    OCR, protobuf/onnx, OpenVINO, VTK, ...). That's fine when a bottle
#    exists, but on the x86_64 leg (no more routine Intel bottles either,
#    same Tier 3 policy) it meant compiling all of it from source under
#    Rosetta — over 3 hours on a single step with no end in sight. Our own
#    CMakeLists.txt only asks for 4 modules (core, imgcodecs, imgproc,
#    videoio), so OpenCV is now built from its own upstream source the same
#    way as Qt above, with BUILD_LIST pruning everything else and
#    WITH_FFMPEG=OFF (native AVFoundation handles camera capture and video
#    writing on macOS) dropping the single heaviest dependency chain.
#
# Runs on every push to main and can be triggered manually from the Actions
# tab (workflow_dispatch) to rebuild on demand without pushing a commit.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - branding: public
            branding_flag: "OFF"
            arch: arm64
          - branding: public
            branding_flag: "OFF"
            arch: x86_64
          - branding: ruelle
            branding_flag: "ON"
            arch: arm64
          - branding: ruelle
            branding_flag: "ON"
            arch: x86_64

    runs-on: macos-14
    # Generous headroom for the from-source Qt build (see note above) —
    # default runner timeout would likely be enough too, but this makes the
    # expectation explicit instead of relying on the default.
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Install cmake (official Kitware binary, avoids Homebrew's curl->openssl build)
        # Homebrew's cmake formula depends on curl, and Homebrew's curl formula
        # depends on openssl@3 — so removing our own explicit openssl@3 line
        # (see the Homebrew deps step below) didn't help: `brew install cmake`
        # still pulled it in transitively. Under Homebrew Tier 3 (no routine
        # Intel bottles), openssl's formula compiles its own full test suite
        # (several hundred .c files) alongside the library itself, which alone
        # blew this step past 45 minutes on the x86_64 leg across five
        # consecutive runs, all while nothing in this project's own code
        # needs cmake to have been built with curl/SSL support at all.
        # Kitware ships a self-contained "universal" (arm64+x86_64 fat)
        # binary release that needs nothing from Homebrew — use that instead,
        # for both architectures, and put it on PATH ahead of anything else.
        env:
          # Unauthenticated GitHub API calls are rate-limited to 60/hour per
          # source IP — with all 4 matrix jobs hitting api.github.com at
          # nearly the same moment from GitHub's own runner IP ranges, 3 of
          # 4 came back "403" on the very first attempt. The automatic
          # GITHUB_TOKEN raises this to 1000/hour, scoped per-repo rather
          # than per-IP, which sidesteps the shared-IP contention entirely.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          # grep -m1 would exit (and close the pipe) as soon as it sees a
          # match, before curl finishes writing the rest of the response —
          # under `pipefail` that SIGPIPE fails the whole command even
          # though the value we wanted was already captured correctly. Let
          # grep read the whole (small) response instead, then take the
          # first match with head.
          CMAKE_VERSION="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/Kitware/CMake/releases/latest \
            | grep '"tag_name"' | head -1 | cut -d'"' -f4 | sed 's/^v//')"
          curl -fL "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-macos-universal.tar.gz" \
            -o "$RUNNER_TEMP/cmake.tar.gz"
          mkdir -p "$RUNNER_TEMP/cmake"
          tar xf "$RUNNER_TEMP/cmake.tar.gz" -C "$RUNNER_TEMP/cmake"
          CMAKE_BIN_DIR="$(dirname "$(find "$RUNNER_TEMP/cmake" -type f -name cmake -perm -u+x | head -1)")"
          echo "$CMAKE_BIN_DIR" >> "$GITHUB_PATH"

      - name: Set up Homebrew prefix for this architecture
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            echo "BREW_PREFIX=/usr/local" >> "$GITHUB_ENV"
            echo "BREW_BIN=/usr/local/bin/brew" >> "$GITHUB_ENV"
            echo "ARCH_PREFIX=arch -x86_64" >> "$GITHUB_ENV"
          else
            echo "BREW_PREFIX=$(brew --prefix)" >> "$GITHUB_ENV"
            echo "BREW_BIN=$(command -v brew)" >> "$GITHUB_ENV"
            echo "ARCH_PREFIX=" >> "$GITHUB_ENV"
          fi

      - name: Install Rosetta 2 (x86_64 cross-build only)
        if: matrix.arch == 'x86_64'
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Install an Intel Homebrew under Rosetta (x86_64 cross-build only)
        # Homebrew's official installer aborts on any host that isn't Apple
        # Silicon (as of Homebrew 7.0) — `arch -x86_64` under Rosetta still
        # reports as x86_64 to `uname -m`, so it refuses here too. Bootstrap
        # manually instead: the classic Intel layout is just the `brew` repo
        # extracted into /usr/local/Homebrew with a symlink into
        # /usr/local/bin — no architecture check involved.
        if: matrix.arch == 'x86_64'
        run: |
          if [ ! -x "$BREW_BIN" ]; then
            # Homebrew itself needs write access to the whole classic Intel
            # directory set (var/Cellar/opt/etc — not just Homebrew/), which
            # the official installer normally sets up for us. Do the same
            # by hand since we can't use that installer here.
            sudo mkdir -p /usr/local/Homebrew /usr/local/Cellar /usr/local/Caskroom \
              /usr/local/Frameworks /usr/local/bin /usr/local/etc /usr/local/include \
              /usr/local/lib /usr/local/opt /usr/local/sbin /usr/local/share /usr/local/var
            sudo chown -R "$(whoami)" /usr/local/Homebrew /usr/local/Cellar /usr/local/Caskroom \
              /usr/local/Frameworks /usr/local/bin /usr/local/etc /usr/local/include \
              /usr/local/lib /usr/local/opt /usr/local/sbin /usr/local/share /usr/local/var
            $ARCH_PREFIX curl -L https://github.com/Homebrew/brew/tarball/main \
              | $ARCH_PREFIX tar xz --strip-components 1 -C /usr/local/Homebrew
            ln -sf /usr/local/Homebrew/bin/brew /usr/local/bin/brew
          fi

      - name: Remove pre-existing python3 symlinks (x86_64 cross-build only)
        # The macos-14 runner image ships its own python3/pip3/idle3 symlinks
        # under /usr/local/bin. Installing opencv pulls in python@3.14 as a
        # dependency, and Homebrew's link step fails (non-fatal to the
        # Cellar install itself, but it makes the whole `brew install`
        # command exit non-zero) when it can't overwrite those pre-existing
        # files. We don't need the system python3 on PATH for this build, so
        # just clear the conflicting symlinks first.
        if: matrix.arch == 'x86_64'
        run: |
          rm -f /usr/local/bin/2to3* /usr/local/bin/idle3* /usr/local/bin/pip3* \
                /usr/local/bin/pydoc3* /usr/local/bin/python3*

      - name: Install non-Qt build dependencies (Homebrew)
        # Homebrew's own qt/qtbase formula cannot be used for a Qt that
        # needs to run on older macOS than this runner: Homebrew's build
        # wrapper ("superenv") strips any CMAKE_OSX_DEPLOYMENT_TARGET /
        # MACOSX_DEPLOYMENT_TARGET override, so it always targets the build
        # host's own OS (confirmed by Homebrew maintainers — see
        # https://github.com/orgs/Homebrew/discussions/2340). That's why the
        # CI-built app crashed on launch on a 2015 MacBook Pro (macOS
        # 12.7.6) with "Symbol not found: __ZNSt3__13pmr15memory_resourceD2Ev"
        # — QtWidgets, built by Homebrew targeting this runner's macOS 14,
        # referenced a libc++ symbol absent on anything older.
        #
        # So the two steps below build Qt itself (qtbase, plus just the
        # macdeployqt tool from qttools) directly from Qt's own upstream
        # source, invoking cmake ourselves — outside Homebrew's superenv,
        # our own -DCMAKE_OSX_DEPLOYMENT_TARGET actually takes effect.
        # Homebrew is still used normally here for qtbase's own (non-Qt)
        # dependency libraries, and for dylibbundler — neither exhibited
        # this symbol problem.
        # dbus and glib are deliberately absent here — they'd only be for
        # QtDBus and Qt's optional glib event-dispatcher, and none of this
        # app's code touches D-Bus (CMakeLists.txt links only Widgets +
        # Concurrent; see FEATURE_dbus/FEATURE_glib=OFF in the Qt build step
        # below). glib's mainloop integration is also a Linux/embedded
        # concern, not a macOS one. Under Homebrew Tier 3 neither reliably
        # has an Intel bottle, and when missing, Homebrew compiles glib from
        # source (600+ translation units) — enough on its own to blow this
        # step past 45 minutes on the x86_64 leg. openssl@3 is absent too,
        # but NOT because we stopped asking for it here: `brew install cmake`
        # itself transitively depends on it (via curl), so simply removing
        # our own explicit "openssl@3" from this line changed nothing — the
        # step kept stalling compiling openssl's full test suite (several
        # hundred more .c files, built by default alongside the library).
        # The real fix is the "Install cmake" step above, which replaces
        # Homebrew's cmake (and therefore its whole curl→openssl dependency
        # chain) with Kitware's own prebuilt binary.
        run: |
          $ARCH_PREFIX "$BREW_BIN" install --verbose ninja pkgconf \
            brotli double-conversion freetype harfbuzz "icu4c@78" \
            jpeg-turbo libb2 libpng md4c pcre2 zstd

      - name: Install dylibbundler (Homebrew)
        run: |
          $ARCH_PREFIX "$BREW_BIN" install --verbose dylibbundler

      - name: Build a minimal OpenCV from source, targeting old macOS
        # Homebrew's opencv formula builds EVERYTHING (dnn, ml, calib3d,
        # stitching, gapi, FFmpeg + its whole codec chain x264/x265/dav1d/
        # svt-av1/libvpx/opus, Tesseract OCR, protobuf/onnx, OpenVINO,
        # VTK, ...) — on the x86_64/Rosetta leg, with no more routine Intel
        # bottles (Homebrew Tier 3), that meant building all of it from
        # source and blew well past 3 hours on a single step with no end in
        # sight. Our own CMakeLists.txt only ever asks for
        # `find_package(OpenCV REQUIRED COMPONENTS core imgcodecs imgproc
        # videoio)` — four modules — so build only those ourselves, the same
        # way the Qt steps above build only what we need. BUILD_LIST prunes
        # the huge unneeded module graph, and WITH_FFMPEG=OFF (relying on
        # the native AVFoundation backend for camera capture and video
        # writing on macOS) drops the single heaviest dependency chain.
        # BUILD_LIST alone doesn't stop OpenCV's module-registration phase
        # from still reaching into gapi/ and videoio/'s init.cmake for every
        # module under modules/ before the exclusion is applied, and both
        # unconditionally try to fetch an optional third-party SDK over the
        # network (gapi's ADE framework, videoio's OrbbecSDK for a camera
        # backend we don't use) — a single DNS hiccup there hard-fails the
        # whole configure step. WITH_ADE=OFF / WITH_OBSENSOR=OFF turn off
        # those fetches outright since we never link either dependency.
        env:
          OPENCV_VERSION: "4.10.0"
        run: |
          set -euxo pipefail
          curl -fL "https://github.com/opencv/opencv/archive/refs/tags/${OPENCV_VERSION}.tar.gz" \
            -o "$RUNNER_TEMP/opencv.tar.gz"
          mkdir -p "$RUNNER_TEMP/opencv-src"
          tar xf "$RUNNER_TEMP/opencv.tar.gz" -C "$RUNNER_TEMP/opencv-src"

          OPENCV_INSTALL_PREFIX="$RUNNER_TEMP/opencv-install"
          echo "OPENCV_INSTALL_PREFIX=$OPENCV_INSTALL_PREFIX" >> "$GITHUB_ENV"

          # No $ARCH_PREFIX here: unlike Qt (see the note in the Qt build
          # step below — it demands QT_HOST_PATH the moment cmake's own
          # host architecture doesn't match the target), OpenCV's CMake
          # doesn't care whether cmake itself runs natively (arm64) or
          # under Rosetta while cross-compiling to x86_64 — it's just an
          # orchestrator here, and Apple clang is architecture-agnostic
          # (only needs the -arch flag), exactly like the app's own
          # Configure/Build steps below.
          cmake -S "$RUNNER_TEMP/opencv-src/opencv-${OPENCV_VERSION}" -B "$RUNNER_TEMP/opencv-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$OPENCV_INSTALL_PREFIX" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DBUILD_LIST=core,imgproc,imgcodecs,videoio \
            -DBUILD_opencv_apps=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_DOCS=OFF \
            -DBUILD_JAVA=OFF \
            -DBUILD_opencv_python2=OFF \
            -DBUILD_opencv_python3=OFF \
            -DWITH_FFMPEG=OFF \
            -DWITH_AVFOUNDATION=ON \
            -DWITH_QT=OFF \
            -DWITH_GTK=OFF \
            -DWITH_ADE=OFF \
            -DWITH_OBSENSOR=OFF

          cmake --build "$RUNNER_TEMP/opencv-build" --parallel "$(sysctl -n hw.logicalcpu)"
          cmake --install "$RUNNER_TEMP/opencv-build"

      - name: Build Qt (qtbase) from source, targeting old macOS
        env:
          QT_VERSION: "6.11.2"
        run: |
          set -euxo pipefail
          QT_SRC_DIR="$RUNNER_TEMP/qt-src"
          QT_INSTALL_PREFIX="$RUNNER_TEMP/qt-install"
          echo "QT_INSTALL_PREFIX=$QT_INSTALL_PREFIX" >> "$GITHUB_ENV"
          mkdir -p "$QT_SRC_DIR"

          curl -fL "https://download.qt.io/official_releases/qt/6.11/${QT_VERSION}/submodules/qtbase-everywhere-src-${QT_VERSION}.tar.xz" \
            -o "$RUNNER_TEMP/qtbase.tar.xz"
          tar xf "$RUNNER_TEMP/qtbase.tar.xz" -C "$QT_SRC_DIR"

          # icu4c/etc are keg-only in Homebrew (not symlinked into
          # $BREW_PREFIX/lib) — collect each one's own prefix so CMake can
          # actually find them, the same way Homebrew's own formula does.
          QT_DEPS_PREFIX_PATH="$BREW_PREFIX"
          for dep in icu4c@78 zstd pcre2 double-conversion freetype harfbuzz jpeg-turbo libpng libb2 md4c brotli; do
            QT_DEPS_PREFIX_PATH="$QT_DEPS_PREFIX_PATH;$($ARCH_PREFIX "$BREW_BIN" --prefix "$dep")"
          done

          # Unlike OpenCV above, Qt's own CMake explicitly checks
          # CMAKE_HOST_SYSTEM_PROCESSOR against CMAKE_OSX_ARCHITECTURES and
          # refuses to configure without QT_HOST_PATH ("You need to set
          # QT_HOST_PATH to cross compile Qt") the moment cmake itself runs
          # natively as arm64 while targeting x86_64 — it needs to run AS
          # x86_64 (so it sees host == target and skips that check). Plain
          # `cmake` now resolves (via the "Install cmake" step's PATH entry)
          # to Kitware's universal binary, which has a real x86_64 slice, so
          # `arch -x86_64 cmake` runs it correctly instead of crashing the
          # way it did against this runner's old arm64-only Homebrew cmake.
          $ARCH_PREFIX cmake -S "$QT_SRC_DIR/qtbase-everywhere-src-${QT_VERSION}" -B "$RUNNER_TEMP/qtbase-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$QT_INSTALL_PREFIX" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_PREFIX_PATH="$QT_DEPS_PREFIX_PATH" \
            -DQT_NO_APPLE_SDK_AND_XCODE_CHECK=ON \
            -DQT_ALLOW_SYMLINK_IN_PATHS=ON \
            -DFEATURE_system_doubleconversion=ON \
            -DFEATURE_system_freetype=ON \
            -DFEATURE_system_harfbuzz=ON \
            -DFEATURE_system_jpeg=ON \
            -DFEATURE_system_libb2=ON \
            -DFEATURE_system_pcre2=ON \
            -DFEATURE_system_png=ON \
            -DFEATURE_system_sqlite=ON \
            -DFEATURE_system_zlib=ON \
            -DFEATURE_sql_mysql=OFF -DFEATURE_sql_odbc=OFF -DFEATURE_sql_psql=OFF \
            -DFEATURE_relocatable=ON \
            -DFEATURE_dbus=OFF \
            -DFEATURE_glib=OFF \
            -DFEATURE_ssl=OFF

          $ARCH_PREFIX cmake --build "$RUNNER_TEMP/qtbase-build" --parallel "$(sysctl -n hw.logicalcpu)"
          $ARCH_PREFIX cmake --install "$RUNNER_TEMP/qtbase-build"

      - name: Locate macdeployqt
        # A full qttools build (Linguist, Designer, Assistant, qdbus tools,
        # qtdiag, 637 targets) came back with macdeployqt nowhere in it —
        # `find -iname '*macdeployqt*'` on that build tree found literally
        # nothing. macdeployqt is actually a qtbase tool (src/macdeployqt),
        # not a qttools one, so it should already be sitting in
        # $QT_INSTALL_PREFIX/bin from the qtbase install two steps ago. If
        # it isn't, search the qtbase build tree (still on disk) to find out
        # where it actually ended up instead of guessing again.
        run: |
          set -x
          if [ -x "$QT_INSTALL_PREFIX/bin/macdeployqt" ]; then
            echo "macdeployqt already present (built as part of qtbase)."
          else
            echo "Not found after qtbase install — searching the qtbase build tree:" >&2
            find "$RUNNER_TEMP/qtbase-build" -iname '*macdeployqt*' >&2 || true
            find "$QT_INSTALL_PREFIX" -iname '*macdeployqt*' >&2 || true
            exit 1
          fi

      - name: Generate the .icns app icon for this branding
        run: |
          mkdir -p resources
          if [ "${{ matrix.branding }}" = "ruelle" ]; then
            iconutil -c icns resources/mac_iconset_ruelle.iconset -o resources/AppIcon_ruelle.icns
          else
            iconutil -c icns resources/mac_iconset_public.iconset -o resources/AppIcon_public.icns
          fi

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DE_LAB_SCHOOL_BRANDING=${{ matrix.branding_flag }} \
            -DCMAKE_PREFIX_PATH="$QT_INSTALL_PREFIX" \
            -DOpenCV_DIR="$OPENCV_INSTALL_PREFIX/lib/cmake/opencv4"

      - name: Build
        run: cmake --build build --config Release -j"$(sysctl -n hw.logicalcpu)"

      - name: Bundle Qt frameworks (macdeployqt)
        run: |
          "$QT_INSTALL_PREFIX/bin/macdeployqt" build/E-Lab700.app -verbose=1

      - name: Bundle non-Qt libraries (OpenCV, via dylibbundler)
        # macdeployqt already copies some non-Qt libraries (our own
        # executable links OpenCV directly, and macdeployqt's dependency
        # walk sweeps those dylibs up too) into Contents/Frameworks, but it
        # does NOT rewrite THEIR internal
        # @rpath dependencies — they keep pointing at the build machine's
        # absolute Homebrew path (e.g. /usr/local/Cellar/opencv/5.0.0/lib),
        # which doesn't exist on the end user's Mac and crashes the app on
        # launch ("Library not loaded: @rpath/libopencv_core.500.dylib").
        # Passing every already-bundled .dylib/.so as an extra -x target
        # makes dylibbundler fix those internal references too, not just
        # the main executable's. -s gives it our OpenCV install's lib/ dir
        # as an explicit fallback search path — without it, dylibbundler hit
        # a known failure mode against our own from-source OpenCV build
        # (versioned dylib symlinks, e.g. libopencv_videoio.410.dylib ->
        # libopencv_videoio.4.10.0.dylib): unable to resolve one from the
        # embedded path alone, it printed "does not exist. Try again" in an
        # infinite loop instead of failing, once spamming gigabytes of log
        # over an hour with the job never progressing.
        run: |
          EXTRA_TARGETS=()
          while IFS= read -r -d '' lib; do
            EXTRA_TARGETS+=(-x "$lib")
          done < <(find build/E-Lab700.app/Contents/Frameworks build/E-Lab700.app/Contents/PlugIns \
                     \( -name "*.dylib" -o -name "*.so" \) -print0 2>/dev/null)

          "$BREW_PREFIX/bin/dylibbundler" -od -b \
            -x build/E-Lab700.app/Contents/MacOS/E-Lab700 \
            "${EXTRA_TARGETS[@]}" \
            -s "$OPENCV_INSTALL_PREFIX/lib" \
            -d build/E-Lab700.app/Contents/libs \
            -p @executable_path/../libs

      - name: Ad-hoc code signature
        # No paid Apple Developer account here, so this is an AD-HOC
        # signature (identity "-"), not a real one — required just for the
        # app to launch AT ALL on Apple Silicon (arm64 refuses to run
        # completely unsigned code, unlike Intel). Gatekeeper will still
        # show "unidentified developer" on first launch; the workaround
        # (right-click > Open, or the Xattr removal below) is documented in
        # README.md > "Compiler pour macOS".
        run: |
          codesign --force --deep --sign - build/E-Lab700.app

      - name: Package .dmg
        run: |
          APP_NAME="E-Lab 700"
          STAGE_DIR="dmg-stage"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"
          cp -R build/E-Lab700.app "$STAGE_DIR/$APP_NAME.app"
          ln -s /Applications "$STAGE_DIR/Applications"

          if [ "${{ matrix.branding }}" = "ruelle" ]; then
            OUT_NAME="E-Lab700-RuelleDeLavenir-Setup-mac-${{ matrix.arch }}.dmg"
          else
            OUT_NAME="E-Lab700-Setup-mac-${{ matrix.arch }}.dmg"
          fi

          # hdiutil intermittently fails with "Resource busy" right after
          # codesign/cp touch the bundle (mdworker/Spotlight briefly holds a
          # lock on the freshly written files) — retry a few times instead
          # of failing the whole job on this known flaky race.
          sync
          for attempt in 1 2 3 4 5; do
            if hdiutil create -volname "$APP_NAME" -srcfolder "$STAGE_DIR" -ov -format UDZO "$OUT_NAME"; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "hdiutil create failed after 5 attempts" >&2
              exit 1
            fi
            echo "hdiutil create failed (attempt $attempt/5), retrying in 5s..."
            sleep 5
          done
          echo "OUT_NAME=$OUT_NAME" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT_NAME }}
